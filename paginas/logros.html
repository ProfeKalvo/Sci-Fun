<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-fun - Mi Expediente</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../scifun/scifun.css">
<script src="../scifun/scifun.js"></script>
<style>
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:28px;padding:32px;margin-bottom:34px;border-radius:32px;color:#fff;background:linear-gradient(135deg,#059669,#0284c7);box-shadow:0 22px 50px -20px rgba(2,132,199,.6)}
@media(min-width:700px){.hero{flex-direction:row}}
.who{position:relative;z-index:1;flex:none}
.ring{width:136px;height:136px;display:grid;place-items:center;border:4px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(255,255,255,.2)}
.ring img{width:96px;height:96px;object-fit:contain}
.lv{position:absolute;left:50%;bottom:-10px;translate:-50% 0;padding:3px 14px;border-radius:99px;font-size:14px;font-weight:900;white-space:nowrap;color:#14532d;background:#fde047;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.hi{position:relative;z-index:1;flex:1;width:100%;text-align:center}
@media(min-width:700px){.hi{text-align:left}}
.hi p{margin:0;font-size:14px;font-weight:600;opacity:.9}
.hi h2{margin:4px 0 12px;font-size:32px;font-weight:900;line-height:1.1}
.hero .bar{height:12px;background:rgba(0,0,0,.28)}
.hero .bar i{background:#fde047}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;font-weight:600}
.wm{position:absolute;right:-20px;bottom:-34px;font-size:150px;opacity:.12;rotate:12deg}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 16px}
.sec h3{margin:0;font-size:22px;font-weight:700}
.sec span{font-weight:600;color:var(--mute)}
.g3{display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g3{grid-template-columns:repeat(3,1fr)}}
.b{align-items:center;padding:26px 16px;text-align:center}
.b .ico{margin:0 auto 12px}
.b h4{margin:0 0 6px;font-size:17px;font-weight:700}
.b p{margin:0;font-size:14px}
.b.lock{filter:grayscale(1);opacity:.55}
.b.lock:hover{transform:none;box-shadow:none;border-color:var(--line)}
.b.on{border-color:var(--c1)}
.lk{position:absolute!important;top:12px;right:12px;font-size:16px}
.reset{margin-top:44px;text-align:center}
.reset button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;text-decoration:underline;color:var(--mute);cursor:pointer}
.reset button:hover{color:#dc2626}
</style>
</head>
<body data-title="Mi expediente" data-stats="off">

<main class="sf-main">
  <section class="hero">
    <div class="who">
      <div class="ring"><img src="AVATAR/CAPIBARA.png" alt="Capi" onerror="SF.fb(this)"></div>
      <span class="lv">Nivel <span id="txt-nivel">1</span></span>
    </div>
    <div class="hi">
      <p>Expediente científico</p>
      <h2 id="txt-rango">Cargando rango...</h2>
      <div class="bar" role="progressbar" aria-label="Progreso al siguiente rango" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="bar-progreso"></i></div>
      <div class="row"><b><span id="txt-puntos">0</span> PX</b><span id="txt-next"></span></div>
    </div>
    <span class="wm" aria-hidden="true">🔬</span>
  </section>

  <div class="sec"><h3>Tus insignias</h3><span id="cuenta"></span></div>
  <div class="g3" id="insignias"></div>

  <div class="reset"><button onclick="reiniciarProgreso()">Reiniciar mi expediente científico</button></div>
</main>

<script>
const INSIGNIAS = [
  { e: '👋', t: 'Primeros pasos', d: 'Completaste el tutorial con Capi.', c: ['#0284c7', '#4f46e5'], ok: s => s.tutorial },
  { e: '🧪', t: 'Cerebro de hierro', d: 'Aprobaste tu primer desafío académico.', c: ['#059669', '#0d9488'], ok: s => s.xp >= 10 },
  { e: '⚡', t: 'Investigador Pro', d: 'Alcanzaste los 100 puntos de experiencia.', c: ['#d97706', '#c2410c'], ok: s => s.xp >= 100 },
  { e: '🎩', t: 'Sucesor de Walter White', d: 'Dominio total del laboratorio (200 PX).', c: ['#7c3aed', '#c026d3'], ok: s => s.xp >= 200 },
  { e: '🗿', t: 'Giga chad de la ciencia', d: 'Dominio de la ciencia (300 PX).', c: ['#db2777', '#e11d48'], ok: s => s.xp >= 300 }
];

function cargarProgreso() {
  const $ = id => document.getElementById(id), s = SF.info();
  $('txt-puntos').innerText = s.xp;
  $('txt-rango').innerText = s.rank;
  $('txt-nivel').innerText = s.lvl;
  $('pb').setAttribute('aria-valuenow', s.pct);
  $('txt-next').innerText = s.next ? 'Faltan ' + (s.next - s.xp) + ' PX para ' + s.nextRank : '¡Rango máximo alcanzado!';
  setTimeout(() => { $('bar-progreso').style.width = s.pct + '%'; }, 300);

  let n = 0;
  $('insignias').innerHTML = INSIGNIAS.map((b, i) => {
    const on = b.ok(s); if (on) n++;
    return `<article class="card b ${on ? 'on' : 'lock'}" style="--i:${i};--c1:${b.c[0]};--c2:${b.c[1]}">
      <span class="lk" aria-hidden="true">${on ? '' : '🔒'}</span>
      <div class="ico" aria-hidden="true">${b.e}</div>
      <h4>${b.t}</h4><p>${b.d}</p>
      <span class="sr">${on ? 'Insignia desbloqueada' : 'Insignia bloqueada'}</span>
    </article>`;
  }).join('');
  $('cuenta').innerText = n + ' de ' + INSIGNIAS.length;
}

function reiniciarProgreso() {
  if (confirm('¿Estás seguro de borrar todos tus logros? Capi se pondrá triste...')) {
    SF.st.set('sci_fun_score', '0');
    SF.st.set('tutorialDone', 'false');
    location.reload();
  }
}
cargarProgreso();
</script>
</body>
</html>
