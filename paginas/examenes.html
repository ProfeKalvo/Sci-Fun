<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-fun - Desafíos Académicos</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../scifun/scifun.css">
<script src="../scifun/scifun.js"></script>
<style>
.intro{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.intro .ico{margin:0;flex:none}
.intro h2{margin:0 0 4px;font-size:26px}
.intro p{margin:0;color:var(--mute)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c1) 18%,transparent);border:1px solid color-mix(in srgb,var(--c1) 45%,transparent)}
#vista-examen{max-width:680px;margin:0 auto}
.say{display:flex;gap:14px;align-items:flex-start;margin:18px 0 22px}
.av{flex:none;width:84px;height:84px;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:contain}
.say .panel{flex:1;padding:16px 20px;border-top-left-radius:6px}
#pregunta-texto{margin:0;font-size:20px;font-weight:700;line-height:1.4}
.say small{display:block;margin-top:10px;text-align:right;font-weight:600;color:var(--mute)}
.opts{display:flex;flex-direction:column;gap:12px}
.op{width:100%;padding:16px 18px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s}
.op:hover{border-color:#10b981;transform:translateX(4px)}
.op.ok{background:#16a34a;border-color:#15803d;color:#fff}
.op.bad{background:#dc2626;border-color:#b91c1c;color:#fff}
.res{max-width:440px;margin:30px auto 0;padding:34px 28px;text-align:center;border:3px solid #34d399}
.res .big{font-size:64px;line-height:1}
.res h2{margin:10px 0 6px;font-size:28px;font-weight:900}
.res p{margin:0 0 16px;color:var(--mute)}
.res .score{font-size:54px;font-weight:900;line-height:1}
.res .pts{margin:6px 0 24px;font-weight:700;color:#15803d}
[data-theme=dark] .res .pts{color:#6ee7b7}
</style>
</head>
<body data-title="Desafíos académicos">

<main class="sf-main">
  <section id="vista-lista">
    <div class="panel intro">
      <div class="ico" style="--c1:#d97706;--c2:#c2410c" aria-hidden="true">📝</div>
      <div>
        <h2>Elige tu misión, Investigador</h2>
        <p>Demuestra lo que has aprendido en el laboratorio virtual.</p>
      </div>
    </div>
    <div class="grid" id="lista"></div>
  </section>

  <section id="vista-examen" hidden>
    <div class="bar" role="progressbar" aria-label="Avance del desafío" id="prog-bar"><i id="prog"></i></div>
    <div class="say">
      <div class="av"><img src="assets/tu-avatar.png" alt="Capi" onerror="SF.fb(this)"></div>
      <div class="panel">
        <p id="pregunta-texto" aria-live="polite">Cargando pregunta...</p>
        <small>Pregunta <span id="num-pregunta">1</span> de <span id="total">6</span></small>
      </div>
    </div>
    <div class="opts" id="contenedor-opciones"></div>
  </section>

  <section id="vista-resultados" class="panel res" hidden>
    <div class="big" aria-hidden="true">🏆</div>
    <h2>¡Misión completada!</h2>
    <p id="msg-final">Has terminado el desafío. Aquí está tu puntaje:</p>
    <div class="score"><span id="puntaje-final">0</span>/<span id="total-final">6</span></div>
    <p class="pts">Respuestas correctas · <span id="pts-ganados">+0</span> pts</p>
    <button class="btn" onclick="guardarYVolver()">Guardar logro y volver</button>
  </section>
</main>

<script>
// --- BASE DE DATOS DE PREGUNTAS ---
const bancoPreguntas = {
  'hibridacion': [
    { q: "¿Qué forma tiene el orbital atómico 's'?", o: ["Mancuerna", "Esférica", "Cuadrada", "Lineal"], a: 1 },
    { q: "La hibridación sp³ (como en el metano) forma una geometría:", o: ["Lineal", "Trigonal plana", "Tetraédrica", "Octaédrica"], a: 2 },
    { q: "¿Cuántos orbitales 'p' se mezclan en la hibridación sp²?", o: ["Uno", "Dos", "Tres", "Ninguno"], a: 1 },
    { q: "El acetileno tiene un enlace triple. ¿Qué hibridación tienen sus carbonos?", o: ["sp", "sp²", "sp³", "s²p"], a: 0 },
    { q: "¿Qué orbital tiene un nodo en el centro donde la probabilidad de hallar el electrón es cero?", o: ["Orbital s", "Orbital p", "Orbital f", "Orbital molecular"], a: 1 },
    { q: "¿Cuál de las siguientes moléculas tiene hibridación sp³?", o: ["Etileno (C2H4)", "Acetileno (C2H2)", "Metano (CH4)", "Dióxido de carbono (CO2)"], a: 2 }
  ],
  'Alquenos': [
    { q: "¿Cuál es el sufijo utilizado para nombrar a los alquenos?", o: ["-eno", "-ino", "-ol", "-ano"], a: 0 },
    { q: "Un hidrocarburo con un enlace triple carbono-carbono es un:", o: ["Alcano", "Alqueno", "Alquino", "Aromático"], a: 2 },
    { q: "¿Qué tipo de isomería presentan los alquenos debido a la restricción de rotación en el doble enlace?", o: ["Isomería estructural", "Isomería geométrica (cis-trans)", "Isomería óptica", "Isomería conformacional"], a: 1 },
    { q: "¿Cuántos átomos de carbono tiene el nonano?", o: ["1", "9", "3", "4"], a: 1 },
    { q: "¿Cuál de las siguientes fórmulas representa un alqueno?", o: ["C2H6", "C2H4", "C2H2", "C6H6"], a: 1 },
    { q: "¿Qué tipo de reacción es común en los alquenos debido a su doble enlace?", o: ["Reacción de sustitución", "Reacción de adición", "Reacción de eliminación", "Reacción de oxidación"], a: 1 }
  ]
  // Cuando tengas las preguntas de 'hidrocarburos', agrégalas aquí y el desafío se activa solo.
};

// Tarjetas de la lista (id = clave en bancoPreguntas)
const EXAMENES = [
  { id: 'hibridacion', t: 'Hibridación del Carbono', d: 'Preguntas sobre orbitales s, p y la formación de sp, sp2 y sp3.', e: '⚛️', c: ['#059669', '#0d9488'] },
  { id: 'hidrocarburos', t: 'Hidrocarburos 3D', d: 'Identifica alcanos, alquenos y alquinos por su estructura.', e: '🧪', c: ['#0284c7', '#4f46e5'] },
  { id: 'Alquenos', t: 'Alquenos', d: 'Preguntas sobre los compuestos con enlaces dobles.', e: '🔗', c: ['#d97706', '#c2410c'] }
];

const $ = s => document.querySelector(s);
$('#lista').innerHTML = EXAMENES.map((x, i) => {
  const n = (bancoPreguntas[x.id] || []).length;
  return `<article class="card" style="--i:${i};--c1:${x.c[0]};--c2:${x.c[1]}">
    <div class="ico" aria-hidden="true">${x.e}</div>
    <h3>${x.t}</h3><p>${x.d}</p>
    <div class="meta"><span class="chip">${n ? n + ' preguntas' : 'Próximamente'}</span>
    <button class="btn" ${n ? '' : 'disabled'} onclick="iniciarExamen('${x.id}')">Comenzar</button></div>
  </article>`;
}).join('');

// --- VARIABLES GLOBALES ---
let examenActual = [], indicePregunta = 0, puntaje = 0, bloqueado = false;

function iniciarExamen(tipo) {
  examenActual = bancoPreguntas[tipo];
  if (!examenActual) return;
  indicePregunta = 0; puntaje = 0;
  $('#total').innerText = examenActual.length;
  $('#vista-lista').hidden = true;
  $('#vista-examen').hidden = false;
  SF.beep(660);
  mostrarPregunta();
}

function mostrarPregunta() {
  bloqueado = false;
  const data = examenActual[indicePregunta];
  $('#num-pregunta').innerText = indicePregunta + 1;
  $('#prog').style.width = (indicePregunta / examenActual.length * 100) + '%';
  $('#pregunta-texto').innerText = data.q;
  const cont = $('#contenedor-opciones');
  cont.innerHTML = '';
  data.o.forEach((opcion, index) => {
    const btn = document.createElement('button');
    btn.className = 'op';
    btn.innerText = opcion;
    btn.onclick = () => verificarRespuesta(index, btn);
    cont.appendChild(btn);
  });
}

function verificarRespuesta(sel, btn) {
  if (bloqueado) return;
  bloqueado = true;
  const correcta = examenActual[indicePregunta].a;
  if (sel === correcta) {
    btn.classList.add('ok'); puntaje++; SF.beep(784, .15);
  } else {
    btn.classList.add('bad');
    document.querySelectorAll('.op')[correcta].classList.add('ok');
    SF.beep(196, .25);
  }
  setTimeout(() => {
    indicePregunta++;
    if (indicePregunta < examenActual.length) mostrarPregunta(); else mostrarResultados();
  }, 1500);
}

function mostrarResultados() {
  const n = examenActual.length, r = puntaje / n;
  $('#prog').style.width = '100%';
  $('#vista-examen').hidden = true;
  $('#vista-resultados').hidden = false;
  $('#puntaje-final').innerText = puntaje;
  $('#total-final').innerText = n;
  $('#pts-ganados').innerText = '+' + (puntaje * 10);
  $('#msg-final').innerText = r === 1 ? '¡Perfecto! Eres un científico de élite.' : r >= .5 ? '¡Buen trabajo! Sigue practicando para mejorar.' : 'Cada error es un descubrimiento. ¡Inténtalo otra vez!';
  [523, 659, 784].forEach((f, i) => setTimeout(() => SF.beep(f, .18), i * 140));
}

function guardarYVolver() {
  // Guardar puntaje acumulativo en LocalStorage (10 puntos por respuesta correcta)
  const actuales = parseInt(SF.st.get('sci_fun_score') || '0') + puntaje * 10;
  SF.st.set('sci_fun_score', actuales);
  window.location.href = '../index.html';
}
</script>
</body>
</html>
