<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-fun - Laboratorio virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sf_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg1:#F0F9F4;--bg2:#cfeedd;--ink:#24443a;--mute:#4d6e60;--card:rgba(255,255,255,.84);--line:rgba(60,150,120,.28);--art:#2f9a79;--artop:.4;--glow:rgba(60,170,135,.3)}
[data-theme=dark]{--bg1:#06151a;--bg2:#0d2e2c;--ink:#e6fff4;--mute:#a3cdbc;--card:rgba(12,38,38,.78);--line:rgba(110,231,183,.25);--art:#6ee7b7;--artop:.36;--glow:rgba(110,231,183,.28)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;flex-direction:column;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,var(--bg2),var(--bg1) 62%) fixed}
:focus-visible{outline:3px solid #0ea5e9;outline-offset:3px}

/* Fondo científico */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#bg .s{fill:none;stroke:var(--art);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:var(--artop)}
#bg .f{fill:var(--art);opacity:calc(var(--artop) + .1)}
#bg text{fill:var(--art);opacity:var(--artop);font-family:'Outfit',sans-serif;font-weight:600}
#bg .star{fill:var(--art);animation:tw 3s ease-in-out infinite alternate}
.fl{animation:fl 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.sp{animation:sp 50s linear infinite}
.sw{animation:sw 4.5s ease-in-out infinite alternate}
.bub{animation:rise 4s ease-in infinite;transform-box:fill-box}
@keyframes fl{to{transform:translateY(-18px) rotate(3deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes tw{from{opacity:.05}to{opacity:.7}}
@keyframes rise{from{transform:translateY(12px);opacity:.9}to{transform:translateY(-34px);opacity:0}}

/* Estructura */
header,main,footer{position:relative;z-index:1}
header{background:var(--card);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
@media(min-width:640px){header{position:sticky;top:0;z-index:20}}
.wrap{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:inherit;text-decoration:none;transition:transform .2s}
.back:hover{transform:translateX(-3px)}
.brand{margin-right:auto}
.brand h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.04em;text-transform:uppercase;font-style:italic;background:linear-gradient(90deg,#15803d,#0284c7);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=dark] .brand h1{background:linear-gradient(90deg,#6ee7b7,#38bdf8);-webkit-background-clip:text;background-clip:text}
.brand p{margin:0;font-size:13px;font-weight:600;color:var(--mute)}
.stats{display:flex;align-items:center;gap:10px;min-width:230px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.lvl{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,#059669,#0284c7);box-shadow:0 0 0 3px var(--glow)}
.st-body{flex:1}
.st-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.st-top span{color:var(--mute)}
.bar{height:7px;margin-top:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#10b981,#38bdf8);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:inherit;font-size:18px;cursor:pointer;transition:transform .2s}
.ib:hover{transform:scale(1.08)}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:36px 20px 150px}
.intro{margin-bottom:30px}
.intro h2{margin:0 0 6px;font-size:34px;font-weight:900;letter-spacing:-.02em}
.intro p{margin:0;max-width:60ch;font-size:17px;line-height:1.5;color:var(--mute)}

/* Tarjetas */
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{--c1:#10b981;--c2:#0d9488;position:relative;display:flex;flex-direction:column;padding:26px;border-radius:26px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);overflow:hidden;opacity:0;animation:enter .6s calc(var(--i)*80ms) forwards;transition:transform .3s,box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.card::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 32%,transparent),transparent 70%)}
.card>*{position:relative;z-index:1}
.card:hover,.card:focus-within{transform:translateY(-8px);border-color:var(--c1);box-shadow:0 22px 44px -16px color-mix(in srgb,var(--c1) 60%,transparent)}
@keyframes enter{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
.ico{width:68px;height:68px;margin-bottom:14px;border-radius:22px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--c1) 70%,transparent);transition:transform .3s}
.card:hover .ico{transform:rotate(-8deg) scale(1.1)}
.tag{align-self:flex-start;margin-bottom:10px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--c1) 18%,transparent);border:1px solid color-mix(in srgb,var(--c1) 45%,transparent)}
.card h3{margin:0 0 8px;font-size:22px;font-weight:700}
.card p{margin:0 0 20px;flex:1;font-size:15px;line-height:1.55;color:var(--mute)}
.cta{display:block;padding:12px;border-radius:16px;text-align:center;font-size:16px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 8px 18px -8px color-mix(in srgb,var(--c1) 80%,transparent)}
.cta::after{content:"";position:absolute;inset:0}
.badge{position:absolute!important;top:16px;right:16px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2));animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
footer{padding:28px;text-align:center;font-size:13px;font-weight:600;color:var(--mute)}

/* Guía: profe Kalvo */
#guia{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#burbuja{max-width:min(300px,80vw);padding:14px 18px;border:2px solid #34d399;border-radius:22px 22px 4px 22px;background:var(--bg1);color:var(--ink);font-size:15px;line-height:1.5;box-shadow:0 14px 34px -10px rgba(0,0,0,.35)}
#burbuja[hidden]{display:none}
#burbuja p{margin:0}
#kalvo{width:112px;height:112px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);cursor:pointer;animation:bob 3.5s ease-in-out infinite;transition:scale .3s}
#kalvo:hover{scale:1.12}
#kalvo img{width:100%;height:100%;object-fit:contain}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(max-width:640px){.stats{order:3;width:100%;min-width:0}.intro h2{font-size:28px}#kalvo{width:88px;height:88px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1}}
</style>
</head>
<body>

<!-- Fondo ilustrado: átomo, orbitales, péndulo doble, matraz, ADN, planeta y fórmulas -->
<svg id="bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><pattern id="gr" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" style="stroke:var(--art)" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="800" fill="url(#gr)" opacity=".13"/>
  <circle class="star" cx="540" cy="120" r="2.5"/><circle class="star" cx="760" cy="300" r="2" style="animation-delay:.8s"/>
  <circle class="star" cx="420" cy="520" r="3" style="animation-delay:1.6s"/><circle class="star" cx="1120" cy="480" r="2.5" style="animation-delay:2.2s"/>
  <circle class="star" cx="330" cy="260" r="2" style="animation-delay:1.1s"/><circle class="star" cx="680" cy="470" r="2.5" style="animation-delay:.4s"/>

  <g transform="translate(170,170)"><g class="sp">
    <g class="s"><ellipse rx="95" ry="34"/><ellipse rx="95" ry="34" transform="rotate(60)"/><ellipse rx="95" ry="34" transform="rotate(120)"/></g>
    <g class="f"><circle r="12"/><circle cx="95" r="6"/><circle cx="95" r="6" transform="rotate(60)"/><circle cx="95" r="6" transform="rotate(120)"/></g>
  </g></g>

  <!-- Péndulo doble -->
  <g transform="translate(900,70)"><g class="sw">
    <g class="s"><path d="M0 0L55 95L25 190"/></g>
    <g class="f"><circle r="5"/><circle cx="55" cy="95" r="10"/><circle cx="25" cy="190" r="13"/></g>
  </g></g>

  <!-- Orbital p -->
  <g transform="translate(580,690)"><g class="fl">
    <g class="s"><path d="M0 0C-34 -86 34 -86 0 0M0 0C-34 86 34 86 0 0"/></g>
    <circle class="f" r="6"/><text x="48" y="8" font-size="24">n, l, m</text>
  </g></g>

  <g transform="translate(1060,340)"><g class="fl">
    <g class="s"><polygon points="50,0 25,43 -25,43 -50,0 -25,-43 25,-43"/><circle r="27"/></g>
    <g class="f"><circle cx="50" r="9"/><circle cx="25" cy="43" r="9"/><circle cx="-25" cy="43" r="9"/><circle cx="-50" r="9"/><circle cx="-25" cy="-43" r="9"/><circle cx="25" cy="-43" r="9"/></g>
  </g></g>

  <g transform="translate(1040,650) scale(1.3)"><g class="fl">
    <g class="s"><path d="M-18 -70H18M-14 -70V-30L-55 40Q-62 56 -46 56H46Q62 56 55 40L14 -30V-70"/></g>
    <path class="f" d="M-38 12H38L55 40Q62 56 46 56H-46Q-62 56 -55 40Z"/>
    <g class="s"><circle class="bub" cx="-12" cy="2" r="5"/><circle class="bub" cx="10" cy="-6" r="3.5" style="animation-delay:1.3s"/><circle class="bub" cx="-2" cy="-10" r="4" style="animation-delay:2.4s"/></g>
  </g></g>

  <g transform="translate(200,660)"><g class="fl s">
    <circle r="44"/><path d="M-32 -18Q0 -32 32 -18M-43 8Q0 -6 43 8"/><ellipse rx="88" ry="20" transform="rotate(-18)"/><circle class="f" cx="92" cy="-44" r="7"/>
  </g></g>

  <g transform="translate(62,330) rotate(12)"><g id="dna" class="s fl"></g></g>

  <text class="fl" x="430" y="60" font-size="30">F = m·a</text>
  <text class="fl" x="330" y="470" font-size="26" style="animation-delay:1.5s">ψ(r, θ, φ)</text>
  <text class="fl" x="760" y="740" font-size="34" style="animation-delay:2s">E = mc²</text>
</svg>

<header>
  <div class="wrap">
    <a class="back" href="../index.html">← Volver</a>
    <div class="brand">
      <h1>Sci-fun</h1>
      <p>Laboratorio virtual</p>
    </div>
    <div class="stats" aria-label="Tu progreso">
      <div class="lvl" id="lvl">1</div>
      <div class="st-body">
        <div class="st-top"><b id="rank">Aprendiz</b><span id="pts">0 pts</span></div>
        <div class="bar" role="progressbar" aria-label="Progreso al siguiente nivel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pbar"><i id="fill"></i></div>
      </div>
    </div>
    <div class="tools">
      <button class="ib" id="btn-snd" aria-label="Activar o silenciar sonidos" title="Sonido">🔊</button>
      <button class="ib" id="btn-theme" aria-label="Cambiar entre modo claro y modo noche" title="Tema">🌙</button>
    </div>
  </div>
</header>

<main>
  <section class="intro">
    <h2>Elige tu experimento</h2>
    <p>Cada simulación se abre en su propia página. Toca una tarjeta y empieza a explorar.</p>
  </section>
  <div id="lobby-grid" class="grid"></div>
</main>

<footer>© 2026 Sci-fun by profe kalvo</footer>

<div id="guia">
  <div id="burbuja" role="status" hidden>
    <p id="mensaje-guia">¡Hola! Soy el profe Kalvo y seré tu guía en este laboratorio virtual, ¿Qué quieres aprender primero?</p>
  </div>
  <button id="kalvo" onclick="toggleGuia()" aria-label="Profe Kalvo: abrir o cerrar mensaje">
    <img src="assets/tu-avatar.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'👨‍🏫',style:'font-size:60px'}))">
  </button>
</div>

<script>
const $ = s => document.querySelector(s);
const st = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ADN del fondo */
(function () {
  let a = '', b = '', r = '';
  for (let y = 0; y <= 280; y += 7) {
    const x = 24 * Math.sin(y / 24);
    a += (y ? 'L' : 'M') + x.toFixed(1) + ' ' + y + ' ';
    b += (y ? 'L' : 'M') + (-x).toFixed(1) + ' ' + y + ' ';
    if (y % 28 === 0) r += 'M' + x.toFixed(1) + ' ' + y + 'L' + (-x).toFixed(1) + ' ' + y;
  }
  $('#dna').innerHTML = '<path d="' + a + '"/><path d="' + b + '"/><path d="' + r + '"/>';
})();

/* Sonido y tema (se comparten con el lobby principal) */
let sndOn = st.get('sf_snd') !== '0', ac;
function beep(f = 520, d = .09) {
  if (!sndOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function paintSnd() { $('#btn-snd').textContent = sndOn ? '🔊' : '🔇'; $('#btn-snd').setAttribute('aria-pressed', sndOn); }
function paintTheme() { $('#btn-theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
$('#btn-snd').onclick = () => { sndOn = !sndOn; st.set('sf_snd', sndOn ? '1' : '0'); paintSnd(); beep(700); };
$('#btn-theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; st.set('sf_theme', t); paintTheme(); beep(440);
};
paintSnd(); paintTheme();

/* Progreso: 'sci_fun_score' (la misma clave que usan Desafíos y Expediente) */
const LEVELS = [[0,'Novato Científico'],[25,'Asistente de Capi'],[50,'Investigador junior'],[200,'Investigador Senior'],[300,'Giga chad de la ciencia']];
const xp = Math.max(0, parseInt(st.get('sci_fun_score')) || 0);
const li = LEVELS.filter(l => xp >= l[0]).length - 1, nxt = LEVELS[li + 1];
const pct = nxt ? Math.round((xp - LEVELS[li][0]) / (nxt[0] - LEVELS[li][0]) * 100) : 100;
$('#lvl').textContent = li + 1;
$('#rank').textContent = LEVELS[li][1];
$('#pts').textContent = xp + ' pts';
$('#pbar').setAttribute('aria-valuenow', pct);
setTimeout(() => { $('#fill').style.width = pct + '%'; }, 400);

/* Guía */
function toggleGuia() { $('#burbuja').hidden = !$('#burbuja').hidden; beep(660, .1); }
// Función para cambiar el mensaje desde otros scripts
function hablarGuia(texto) {
  $('#mensaje-guia').innerText = texto;
  $('#burbuja').hidden = false;
}

// BASE DE DATOS MODULAR (agrega "nuevo: true" para mostrar la insignia Nuevo)
const simulaciones = [
  { titulo: "Orbitales Atómicos", categoria: "Física Cuántica",
    descripcion: "Explora la forma de las nubes electrónicas y los números cuánticos n, l y m.",
    imagen: "⚛️", link: "sim/orbitales_2.html" },
  { titulo: "Hibridización Orbital", categoria: "Enlace Químico",
    descripcion: "Descubre cómo se pueden mezclar los orbitales atómicos para formar enlaces químicos y la geometría de las moléculas.",
    imagen: "👨‍🔬", link: "sim/hibridización.html" },
  { titulo: "Carbono e Hidrógeno", categoria: "Enlace Químico",
    descripcion: "Observa cómo el Carbono sp³ forma enlaces sigma (σ) con átomos de Hidrógeno.",
    imagen: "⚛️", link: "sim/carbono-hidrogeno.html" },
  { titulo: "Explora el caos", categoria: "Sistemas dinámicos",
    descripcion: "Descubre como pequeñas variaciones pueden generar resultados totalmente inesperados.",
    imagen: "🌪️", link: "sim/SIMULACIÓNDELCAOS.html" },
  { titulo: "Difusión y Ósmosis", categoria: "Biología Celular",
    descripcion: "Observa cómo las partículas se mueven a favor del gradiente y cómo el agua cruza membranas semipermeables.",
    imagen: "🫧", link: "sim/difusion.html" },
  { titulo: "Péndulo Doble", categoria: "Mecánica Clásica",
    descripcion: "Observa el comportamiento caótico de un péndulo doble.",
    imagen: "🪀", link: "sim/PENDULO.html" }
];

// Un par de colores por categoría (si agregas una nueva usa el color por defecto)
const COLORES = {
  'física cuántica': ['#7c3aed', '#4f46e5'],
  'mecánica clásica': ['#d97706', '#c2410c'],
  'enlace químico': ['#059669', '#0d9488'],
  'sistemas dinámicos': ['#db2777', '#e11d48'],
  'biología celular': ['#0284c7', '#0d9488']
};

function renderizarLobby() {
  const grid = $('#lobby-grid');
  grid.innerHTML = simulaciones.map((sim, i) => {
    const [c1, c2] = COLORES[sim.categoria.toLowerCase()] || ['#059669', '#0d9488'];
    const cat = sim.categoria.charAt(0).toUpperCase() + sim.categoria.slice(1);
    return `
      <article class="card" style="--i:${i};--c1:${c1};--c2:${c2}">
        ${sim.nuevo ? '<span class="badge">Nuevo</span>' : ''}
        <div class="ico" aria-hidden="true">${sim.imagen}</div>
        <span class="tag">${cat}</span>
        <h3>${sim.titulo}</h3>
        <p>${sim.descripcion}</p>
        <a class="cta" href="${sim.link}" aria-label="Abrir simulación: ${sim.titulo}">Demole!!</a>
      </article>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(c => {
    c.addEventListener('mouseenter', () => beep(500, .05));
    c.addEventListener('click', () => beep(700, .1));
  });
}
renderizarLobby();

window.onload = () => {
  setTimeout(() => hablarGuia("¡Hola! Soy el profe Kalvo. ¿Qué quieres aprender hoy?"), 1000);
};
</script>
</body>
</html>
